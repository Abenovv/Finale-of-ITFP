<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f5f1">
  <title>DailyPlanner</title>
  <link rel="icon" type="image/png" href="dailyplanner-icon.png">
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="#tasks"><img class="brand-mark" src="dailyplanner-icon.png" width="28" height="28" alt="">DailyPlanner</a>
      <nav aria-label="DailyPlanner">
        <a href="#tasks" data-view="tasks">Tasks</a>
        <a href="#planner" data-view="planner">Plan</a>
        <a href="#reports" data-view="reports">Reports</a>
      </nav>
      <button class="button primary" id="new-task" type="button"><span aria-hidden="true">+</span> New task</button>
    </div>
  </header>

  <main class="workspace">
    <div class="heading">
      <h1 id="page-label">Tasks</h1>
      <p id="task-summary"></p>
    </div>

    <form class="settings-bar" id="settings-form" aria-label="Planning settings">
      <label>Planning date <input type="date" name="date" max="9999-12-30" required></label>
      <label>Time budget <span class="unit-field"><input type="number" name="capacity" min="1" max="480" required><span aria-hidden="true">min</span></span></label>
      <label>Minimum priority <select name="minimum"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select></label>
    </form>
    <div id="notice" class="notice" role="status" hidden></div>

    <section id="tasks-view" aria-label="Task list">
      <div class="tasks-layout">
        <div class="surface task-list">
          <div class="list-toolbar">
            <div class="segments" aria-label="Filter by status">
              <button type="button" data-filter="all" aria-pressed="true">All</button>
              <button type="button" data-filter="open" aria-pressed="false">Open</button>
              <button type="button" data-filter="done" aria-pressed="false">Done</button>
            </div>
            <label class="search"><span class="visually-hidden">Search tasks</span><input type="search" id="task-search" placeholder="Search tasks"></label>
          </div>
          <div class="table-scroll"><table>
            <thead><tr><th scope="col">Task</th><th scope="col">Due date</th><th scope="col">Priority</th><th scope="col" class="num">Time</th><th scope="col" class="num">Actions</th></tr></thead>
            <tbody id="task-rows"></tbody>
          </table></div>
        </div>
        <aside class="workload-card">
          <h2>Workload</h2>
          <p id="overview-range" class="muted"></p>
          <div id="overview-workload"></div>
          <a class="text-link" href="#reports">View reports <span aria-hidden="true">→</span></a>
        </aside>
      </div>
    </section>

    <section id="planner-view" aria-label="Daily plan" hidden>
      <div class="plan-layout">
        <form id="plan-form" class="surface plan-controls">
          <label>Scoring policy <select name="policy"><option value="importance">Importance first</option><option value="short">Short tasks first</option></select></label>
          <label class="check-field"><input name="fit" type="checkbox" checked> Defer tasks that don’t fit</label>
          <button class="button primary" type="submit">Build plan</button>
        </form>
        <div class="surface plan-output" aria-live="polite">
          <p id="plan-error" class="form-error"></p>
          <div id="plan-result"><p class="empty">No plan yet.</p></div>
        </div>
      </div>
    </section>

    <section id="reports-view" aria-label="Reports" hidden>
      <div class="report-toolbar">
        <h2>Focus rankings</h2>
        <a id="download" class="button secondary" download hidden>Download CSV</a>
      </div>
      <p id="report-status" class="muted" role="status" hidden></p>
      <div id="report-results" hidden>
        <div class="report-grid">
          <section class="surface report-card"><h3>Importance first</h3><div id="importance-results"></div></section>
          <section class="surface report-card"><h3>Short tasks first</h3><div id="short-results"></div></section>
        </div>
        <section class="surface report-card report-workload"><h2>Workload by day</h2><div id="report-workload"></div></section>
      </div>
    </section>
  </main>

  <dialog id="task-dialog" aria-labelledby="dialog-title">
    <form id="task-form">
      <header class="dialog-heading"><h2 id="dialog-title">New task</h2><button class="icon-button" id="close-dialog" type="button" aria-label="Close">×</button></header>
      <div id="task-fields">
        <label>Task title <input name="title" maxlength="160" required></label>
        <div class="field-pair">
          <label>Task ID <input name="id" maxlength="32" required></label>
          <label>Due date <input name="date" type="date" max="9999-12-31" required></label>
        </div>
        <div class="field-pair">
          <label>Priority <select name="importance"><option>1</option><option>2</option><option selected>3</option><option>4</option><option>5</option></select></label>
          <label>Estimated minutes <input name="minutes" type="number" min="0" max="480" value="30" required></label>
        </div>
      </div>
      <div id="date-fields" hidden><p id="task-context" class="muted"></p><label><span id="action-date-label"></span><input name="actionDate" type="date" max="9999-12-31" required></label></div>
      <p class="form-error" id="task-error" aria-live="polite"></p>
      <footer class="dialog-actions"><button class="button secondary" id="cancel-task" type="button">Cancel</button><button class="button primary" id="save-task" type="submit">Save task</button></footer>
    </form>
  </dialog>
</body>
</html>
